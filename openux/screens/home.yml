name: Home
description: Account overview with navigation, performance metrics, recent activity, and account insights.
note: This example demonstrates a dashboard composed from a page layout, a nested content layout, and reusable components.
assets:
  - asset-template: dashboard-layout
    name: Account dashboard
    slots:
      header:
        - asset-template: dashboard-header
          name: Dashboard header
      navigation:
        - asset-template: dashboard-navigation
          name: Main navigation
      content:
        - asset-template: dashboard-overview
          name: Account overview
          slots:
            welcome:
              - asset-template: dashboard-welcome
                name: Welcome panel
            metrics:
              - asset-template: dashboard-metric
                name: Available balance
                attributes:
                  label: Available balance
                  value: "$24,680.50"
                  change: "+$1,240 this month"
                  trend: positive
              - asset-template: dashboard-metric
                name: Monthly income
                attributes:
                  label: Monthly income
                  value: "$8,420.00"
                  change: "+6.4% from last month"
                  trend: positive
              - asset-template: dashboard-metric
                name: Monthly spending
                attributes:
                  label: Monthly spending
                  value: "$3,185.72"
                  change: "12.8% of your budget"
                  trend: neutral
              - asset-template: dashboard-metric
                name: Savings goal
                attributes:
                  label: Savings goal
                  value: "$6,250"
                  change: "62% of your $10,000 goal"
                  trend: positive
            activity:
              - asset-template: dashboard-activity
                name: Recent activity
            insights:
              - asset-template: dashboard-insights
                name: Account insights
