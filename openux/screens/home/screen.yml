name: Home
description: Account overview with navigation, performance metrics, recent
  activity, and account insights.
note: This example demonstrates a dashboard composed from a page layout, a
  nested content layout, and reusable components.
preview-states:
  - id: default
    name: Dashboard
  - id: add-item-open
    name: Add item dialog open
    description: Show the Add item dialog over the dashboard.
spec: screens/home/specs/screen.md
elements:
  - id: account-dashboard
    name: Account dashboard
    slots:
      header:
        - id: dashboard-header
          name: Dashboard header
          type: template
          src: screens/home/assets/dashboard-header.html
      navigation:
        - id: main-navigation
          name: Main navigation
          type: template
          src: screens/home/assets/dashboard-navigation.html
      content:
        - id: account-overview
          name: Account overview
          slots:
            welcome:
              - id: welcome-panel
                name: Welcome panel
                type: template
                src: screens/home/assets/dashboard-welcome.html
            metrics:
              - id: available-balance
                name: Available balance
                attributes:
                  label: Available balance
                  value: $25,680.50
                  change: +$1,240 this month
                  trend: positive
                type: template
                src: screens/home/assets/dashboard-metric.html
              - id: monthly-income
                name: Monthly income
                attributes:
                  label: Monthly income
                  value: $8,420.00
                  change: +6.4% from last month
                  trend: positive
                type: template
                src: screens/home/assets/dashboard-metric.html
              - id: monthly-spending
                name: Monthly spending
                attributes:
                  label: Monthly spending
                  value: $3,185.72
                  change: 12.8% of your budget
                  trend: neutral
                type: template
                src: screens/home/assets/dashboard-metric.html
              - id: savings-goal
                name: Savings goal
                attributes:
                  label: Savings goal
                  value: $6,250
                  change: 62% of your $10,000 goal
                  trend: positive
                type: template
                src: screens/home/assets/dashboard-metric.html
            activity:
              - id: recent-activity
                name: Recent activity
                type: template
                src: screens/home/assets/dashboard-activity.html
            insights:
              - id: account-insights
                name: Account insights
                type: template
                src: screens/home/assets/dashboard-insights.html
          type: template
          src: screens/home/assets/dashboard-overview.html
        - id: add-item-dialog
          name: Add item dialog
          visibility:
            default: false
            add-item-open: true
          type: template
          src: screens/home/assets/dashboard-dialog.html
    type: template
    src: screens/home/assets/dashboard-layout.html
