id: sign-in-field-visual
name: Sign-in Field Preview
description: A static, editable field-shaped visual; it does not accept or collect input.
category: Forms/Sign-in
attributes:
  label:
    type: string
    default: Email address
    overridable: true
  preview-value:
    type: string
    default: name@example.com
    overridable: true
  hint:
    type: string
    default: EMAIL
    overridable: true
  icon:
    type: string
    default: "@"
    overridable: true
render:
  type: html-reference
  source: asset.html
