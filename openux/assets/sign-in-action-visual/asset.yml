id: sign-in-action-visual
name: Sign-in Action Preview
description: A static visual action treatment for a primary or alternative sign-in option.
category: Forms/Sign-in
attributes:
  label:
    type: string
    default: Continue
    overridable: true
  variant:
    type: list
    options:
      - primary
      - secondary
    default: primary
    overridable: true
  mark:
    type: string
    default: ""
    overridable: true
render:
  type: html-reference
  source: asset.html
