id: dashboard-metric
name: Dashboard Metric
description: A reusable summary card with a value and comparison detail.
category: Dashboards/Components
attributes:
  label:
    type: string
    default: Account metric
    overridable: true
  value:
    type: string
    default: "0"
    overridable: true
  change:
    type: string
    default: No change
    overridable: true
  trend:
    type: list
    options:
      - positive
      - neutral
      - negative
    default: positive
    overridable: true
render:
  type: html-reference
  source: asset.html
