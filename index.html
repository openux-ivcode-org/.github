<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A local OpenUX editor prototype with project save support.">
  <title>OpenUX Studio</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to screen preview</a>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">O</span><span>OpenUX Studio</span></div>
    <div class="workspace-context" id="workspace-context">
      <div class="context-title">
        <div class="eyebrow" id="breadcrumb">Screens</div>
        <h1 id="screen-heading">Loading project...</h1>
      </div>
    </div>
    <div class="topbar-spacer"></div>
    <button class="save-button" id="save-project" type="button" disabled>Save</button>
    <button class="reset-button" id="reset-project" type="button">Reset from files</button>
  </header>

  <div class="workspace" id="workspace">
    <aside class="sidebar" aria-label="OpenUX project files">
      <div class="screen-quick-selector" id="screen-quick-selector">
        <button
          class="screen-selector-toggle"
          id="screen-selector-toggle"
          type="button"
          aria-label="Choose a Screen"
          aria-haspopup="listbox"
          aria-controls="screen-selector-options"
          aria-expanded="false"
          disabled
        >
          <span class="screen-selector-search-icon" aria-hidden="true"></span>
          <span>Go to Screen</span>
          <span class="screen-selector-chevron" aria-hidden="true"></span>
        </button>
        <div class="screen-selector-panel" id="screen-selector-panel" hidden>
          <label class="screen-selector-search-label" for="screen-selector-search">Search Screens</label>
          <input
            class="screen-selector-search"
            id="screen-selector-search"
            type="search"
            placeholder="Search by name or ID"
            autocomplete="off"
            aria-controls="screen-selector-options"
          >
          <div
            class="screen-selector-options"
            id="screen-selector-options"
            role="listbox"
            aria-label="Available Screens"
          ></div>
          <div class="screen-selector-no-results" id="screen-selector-no-results" role="status" hidden>
            No matching Screens.
          </div>
        </div>
      </div>
      <div class="file-explorer-heading">
        <div class="side-label">OpenUX project</div>
        <button class="create-screen-button" id="create-screen" type="button" aria-label="Create new Screen" title="Create an empty Screen" disabled>+</button>
      </div>
      <div id="project-file-tree" class="project-file-tree" aria-label="Project files"></div>
    </aside>
    <div
      class="panel-resizer sidebar-resizer"
      id="sidebar-resizer"
      role="separator"
      aria-label="Resize project files panel"
      aria-orientation="vertical"
      aria-controls="sidebar main"
      aria-valuemin="180"
      aria-valuemax="420"
      aria-valuenow="238"
      title="Drag or use the arrow keys to resize the project files panel"
      tabindex="0"
    ></div>

    <main class="canvas" id="main">
      <section class="stage" id="screen-stage" aria-label="Rendered Screen preview; drop an asset here to add it">
        <div class="preview-state-toolbar" id="preview-state-toolbar" aria-label="Screen view and preview states" hidden>
          <div class="preview-state-controls" id="preview-state-controls">
            <label class="preview-state-label" for="preview-state-select">Preview state</label>
            <select class="preview-state-select" id="preview-state-select"></select>
            <button class="preview-state-add" id="add-preview-state" type="button">Add state</button>
          </div>
          <button
            class="preview-state-add open-screen-preview-button"
            id="screen-preview-new-tab"
            type="button"
            title="Open this Screen as a static webpage in a new tab"
          >
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M9 2h5v5M14 2 7 9"></path>
              <path d="M12 9v4H3V4h4"></path>
            </svg>
            <span>Open preview</span>
          </button>
          <div class="screen-view-selector" role="group" aria-label="Screen view">
            <button
              class="screen-view-button"
              id="screen-view-preview"
              type="button"
              aria-pressed="true"
              aria-controls="screen-preview screen-yaml-editor-panel"
            >Preview</button>
            <button
              class="screen-view-button"
              id="screen-view-yaml"
              type="button"
              aria-pressed="false"
              aria-controls="screen-preview screen-yaml-editor-panel"
            >YAML</button>
          </div>
        </div>
        <article class="screen-preview loading" id="screen-preview" aria-label="Rendered Screen preview">
          <div class="loading-message">Reading project files...</div>
        </article>
        <section class="screen-yaml-editor-panel" id="screen-yaml-editor-panel" aria-label="Screen YAML editor" hidden>
          <h2 class="screen-yaml-editor-heading">Screen YAML</h2>
          <textarea
            class="asset-yaml-source screen-yaml-source"
            id="screen-yaml-source"
            aria-label="Screen YAML source"
            spellcheck="false"
          ></textarea>
          <div class="screen-yaml-status" id="screen-yaml-status" role="status" aria-live="polite"></div>
        </section>
        <div class="annotation-toolbar" id="annotation-toolbar" role="toolbar" aria-label="Screen annotation tools" hidden>
        <div class="annotation-tool-buttons" role="group" aria-label="Choose annotation tool">
          <button class="annotation-tool-button" id="annotation-tool-pen" type="button" data-annotation-tool="pen" aria-label="Pen" title="Pen" aria-pressed="true" disabled>
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="m4 13.5 8.8-8.8a1.8 1.8 0 0 1 2.5 2.5l-8.8 8.8L3 17z"></path>
              <path d="m11.5 6 2.5 2.5"></path>
            </svg>
          </button>
          <button class="annotation-tool-button" id="annotation-tool-circle" type="button" data-annotation-tool="circle" aria-label="Circle" title="Circle" aria-pressed="false" disabled>
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <circle cx="10" cy="10" r="6.5"></circle>
            </svg>
          </button>
          <button class="annotation-tool-button" id="annotation-tool-rectangle" type="button" data-annotation-tool="rectangle" aria-label="Rectangle" title="Rectangle" aria-pressed="false" disabled>
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <rect x="3.5" y="4.5" width="13" height="11" rx="1.5"></rect>
            </svg>
          </button>
          <button class="annotation-tool-button" id="annotation-tool-arrow" type="button" data-annotation-tool="arrow" aria-label="Arrow" title="Arrow" aria-pressed="false" disabled>
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M4 15 15 4M7 4h8v8"></path>
            </svg>
          </button>
          <button class="annotation-tool-button" id="annotation-tool-highlight" type="button" data-annotation-tool="highlight" aria-label="Highlighter" title="Highlighter" aria-pressed="false" disabled>
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="m5 12 7-7 4 4-7 7H5z"></path>
              <path d="M4 16h11"></path>
            </svg>
          </button>
          <button class="annotation-tool-button" id="annotation-tool-note" type="button" data-annotation-tool="note" aria-label="Note" title="Note" aria-pressed="false" disabled>
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M4 3.5h12v10H9l-4 3v-3H4z"></path>
              <path d="M7 7h6M7 10h4"></path>
            </svg>
          </button>
        </div>
        <span class="annotation-toolbar-divider" aria-hidden="true"></span>
        <div class="annotation-action-buttons" role="group" aria-label="Annotation actions">
          <button class="annotation-tool-button" id="annotation-undo" type="button" aria-label="Undo annotation" title="Undo" disabled>
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M7 6 3.5 9.5 7 13"></path>
              <path d="M4 9.5h7a5 5 0 0 1 5 5"></path>
            </svg>
          </button>
          <button class="annotation-tool-button" id="annotation-redo" type="button" aria-label="Redo annotation" title="Redo" disabled>
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="m13 6 3.5 3.5L13 13"></path>
              <path d="M16 9.5H9a5 5 0 0 0-5 5"></path>
            </svg>
          </button>
          <button class="annotation-tool-button" id="annotation-clear" type="button" aria-label="Clear annotations" title="Clear annotations" disabled>
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M4.5 6h11M8 6V4h4v2m2 0-.7 10H6.7L6 6"></path>
              <path d="M8.5 9v4M11.5 9v4"></path>
            </svg>
          </button>
        </div>
        <span class="annotation-status" id="annotation-status" role="status" aria-live="polite"></span>
        <button class="annotation-mode-exit" id="annotation-mode-exit" type="button" aria-label="Exit annotation mode" title="Exit annotation mode" hidden>
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="m5 5 10 10M15 5 5 15"></path>
          </svg>
          <span>Exit</span>
        </button>
        </div>
      </section>

      <section class="spec-editor-panel" id="spec-editor-panel" aria-label="Behavior spec Markdown editor" hidden>
        <h2 class="spec-editor-heading" id="spec-editor-heading">Behavior spec</h2>
        <textarea class="spec-source" id="spec-source" aria-label="Behavior spec Markdown source" spellcheck="false"></textarea>
        <div class="spec-status" id="spec-status" role="status" aria-live="polite"></div>
      </section>

      <section class="asset-document-editor-panel" id="asset-document-editor-panel" aria-label="Asset template source editor" hidden>
        <h2 class="asset-document-editor-heading" id="asset-document-editor-heading">Asset template source</h2>
        <textarea class="asset-document-source" id="asset-document-source" aria-label="Asset template source" spellcheck="false"></textarea>
        <div class="asset-document-status" id="asset-document-status" role="status" aria-live="polite"></div>
      </section>

      <div class="editor-message" id="editor-message" role="status" aria-live="polite"></div>
    </main>

    <div
      class="panel-resizer inspector-resizer"
      id="inspector-resizer"
      role="separator"
      aria-label="Resize details panel"
      aria-orientation="vertical"
      aria-controls="main inspector"
      aria-valuemin="220"
      aria-valuemax="480"
      aria-valuenow="292"
      title="Drag or use the arrow keys to resize the details panel"
      tabindex="0"
    ></div>
    <aside class="inspector" aria-label="Selected item details">
      <div id="inspector-content">
        <h2 class="panel-heading">Details</h2>
        <div class="loading-message">Loading details...</div>
      </div>
    </aside>
  </div>
  <div class="asset-context-menu" id="asset-context-menu" role="menu" aria-label="Asset actions" hidden>
    <button id="asset-context-edit-template" type="button" role="menuitem" tabindex="-1">Edit Template</button>
    <button id="asset-context-copy-details" type="button" role="menuitem" tabindex="-1">Copy Details</button>
    <div role="separator"></div>
    <button id="asset-context-delete" class="danger" type="button" role="menuitem" tabindex="-1">Delete Asset</button>
  </div>
  <dialog class="asset-delete-dialog" id="asset-delete-dialog" aria-labelledby="asset-delete-title" aria-describedby="asset-delete-message">
    <h2 id="asset-delete-title">Delete asset?</h2>
    <p id="asset-delete-message"></p>
    <div class="asset-delete-dialog-actions">
      <button id="asset-delete-cancel" type="button">Cancel</button>
      <button id="asset-delete-confirm" class="danger" type="button">Delete Asset</button>
    </div>
  </dialog>
  <script src="./vendor/html-to-image.js"></script>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
